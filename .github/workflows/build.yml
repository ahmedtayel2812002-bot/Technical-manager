name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q technician_manager_app_upload.zip -d project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        working-directory: project/technician_manager_app
        run: |
          flutter create --platforms=android .

      - name: Install dependencies
        working-directory: project/technician_manager_app
        run: flutter pub get

      - name: Build APK
        working-directory: project/technician_manager_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: technician-manager-apk
          path: project/technician_manager_app/build/app/outputs/flutter-apk/app-release.apk
